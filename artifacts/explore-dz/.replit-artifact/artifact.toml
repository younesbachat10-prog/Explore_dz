kind = "mobile"
previewPath = "/explore-dz/"
title = "اكتشف الجزائر – Explore DZ"
description = "تطبيق عربي لاستكشاف ولايات الجزائر ومعالمها الطبيعية والتاريخية ومأكولاتها، مع خريطة ومفضلة وتحديات ونقاط."
version = "1.0.0"
id = "artifacts/explore-dz"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/explore-dz/" ]
localPort = 23894

[services.development]
run = "pnpm --filter @workspace/explore-dz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/explore-dz", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/explore-dz", "run", "serve" ]

[services.env]
PORT = "23894"
BASE_PATH = "/explore-dz/"
